name: Supabase keepalive

# Free-tier Supabase pauses the project after ~7 days with no database
# activity, and Vercel separately flags/pauses projects with no deployment
# activity after ~7 days. Running daily keeps both clocks well inside their
# thresholds.
on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {} # lets us trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keepalive endpoint
        run: curl -f https://test.suntcastigator.ro/api/keepalive

      - name: Trigger Vercel redeploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret not set, skipping"
            exit 0
          fi
          curl -f -X POST "$VERCEL_DEPLOY_HOOK_URL"
