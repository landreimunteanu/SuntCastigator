name: Supabase keepalive

# Free-tier Supabase pauses the project after ~7 days with no database
# activity. This pings a route that runs a real query (see
# app/api/keepalive/route.ts) often enough to prevent that.
on:
  schedule:
    - cron: "0 6 */2 * *" # every 2 days at 06:00 UTC
  workflow_dispatch: {} # lets us trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: curl -f https://test.suntcastigator.ro/api/keepalive
